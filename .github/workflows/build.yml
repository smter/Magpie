name: build

on:
  push:
    paths: [ '.github/workflows/build.yml', 'Magpie.slnx', '*.props', 'scripts/publish.py', 'src/**' ]
  pull_request:
    paths: [ '.github/workflows/build.yml', 'Magpie.slnx', '*.props', 'scripts/publish.py', 'src/**' ]
  workflow_dispatch:
    inputs:
      compiler:
        description: Compiler
        required: true
        default: MSVC
        type: choice
        options: [MSVC, ClangCL]
      platform:
        description: Platform
        required: true
        default: x64
        type: choice
        options: [x64, ARM64]

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        compiler: ["MSVC", "ClangCL"]
        platform: ["x64", "ARM64"]

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Setup Conan
      run: pip install conan

    - name: Load Conan cache
      uses: actions/cache@v6
      with:
        path: ~/.conan2/p
        key: Conan-${{ hashFiles('src/**/conanfile.txt') }}-${{ matrix.compiler }}-${{ matrix.platform }}

    - name: Build
      if: github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main'
      run: python scripts/publish.py --compiler=${{ matrix.compiler }} --platform=${{ matrix.platform }}

    - name: Diagnostic dump (priconfig, for pri-merge design)
      if: success()
      shell: pwsh
      run: |
        foreach ($proj in @("MagpieVideo", "Magpie")) {
          $cfg = "obj\x64\Release\$proj\priconfig.xml"
          if (Test-Path $cfg) { Write-Host "===== $proj priconfig.xml ====="; Get-Content $cfg }
          $emb = "obj\x64\Release\$proj\embed"
          if (Test-Path $emb) { Write-Host "===== $proj embed tree ====="; Get-ChildItem $emb -Recurse -File | ForEach-Object { $_.FullName.Replace((Resolve-Path $emb).Path, 'embed') } }
        }
        Write-Host "===== makepri version ====="
        & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\MakePri.exe' new /? 2>&1 | Select-String -Pattern 'AutoMerge|IndexFile|OutputFile|IndexName' | ForEach-Object { $_.Line.Trim() }

    - name: Build and sign
      if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
      run: python scripts/publish.py --compiler=${{ matrix.compiler }} --platform=${{ matrix.platform }} --pfx-path=certs\Magpie.pfx --pfx-password="${{ secrets.MAGPIE_PFX_PASSWORD }}"

    - name: Save hash
      id: hash
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

    - name: Store build
      uses: actions/upload-artifact@v7
      with: 
          name: Magpie-dev-${{ steps.hash.outputs.sha_short }}-${{ matrix.compiler }}-${{ matrix.platform }}
          path: ./publish/${{ matrix.platform }}
